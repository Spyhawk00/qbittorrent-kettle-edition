<!DOCTYPE html>
<html lang="${LANG}" class="dark">

<head>
    <meta charset="UTF-8">
    <title>QBT_TR(Remove tracker)QBT_TR[CONTEXT=confirmDeletionDlg]</title>
    <link rel="stylesheet" href="css/style.css?v=${CACHEID}" type="text/css">
    <script defer src="scripts/localpreferences.js?v=${CACHEID}"></script>
    <script defer src="scripts/color-scheme.js?v=${CACHEID}"></script>
    <script>
        "use strict";

        window.addEventListener("DOMContentLoaded", (event) => {
            window.addEventListener("keydown", (event) => {
                switch (event.key) {
                    case "Escape":
                        event.preventDefault();
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                        break;
                }
            });

            const searchParams = new URLSearchParams(window.location.search);
            const host = searchParams.get("host");

            document.getElementById("confirmDeleteTrackerText").textContent = "QBT_TR(Are you sure you want to remove tracker %1 from all torrents?)QBT_TR[CONTEXT=TrackersFilterWidget]".replace("%1", host);

            document.getElementById("cancelBtn").focus();
            document.getElementById("cancelBtn").addEventListener("click", (e) => {
                e.stopPropagation();
                window.parent.qBittorrent.Client.closeFrameWindow(window);
            });
            document.getElementById("confirmBtn").addEventListener("click", (e) => {
                e.stopPropagation();

                fetch("api/v2/torrents/removeTrackers", {
                        method: "POST",
                        body: new URLSearchParams({
                            hash: "*",
                            urls: searchParams.get("urls")
                        })
                    })
                    .then((response) => {
                        if (!response.ok)
                            return;

                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                    });
            });
        });
    </script>
</head>

<body class="dialogPage">
    <div class="dialogPageContent">
        <p id="confirmDeleteTrackerText" class="dialogMessage"></p>
    </div>
    <div class="dialogButtons">
        <button type="button" id="confirmBtn">QBT_TR(Remove)QBT_TR[CONTEXT=MainWindow]</button>
        <button type="button" id="cancelBtn">QBT_TR(Cancel)QBT_TR[CONTEXT=MainWindow]</button>
    </div>
</body>

</html>
