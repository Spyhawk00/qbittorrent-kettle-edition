<!DOCTYPE html>
<html lang="${LANG}" class="dark">

<head>
    <meta charset="UTF-8">
    <title>QBT_TR(Please choose a folder name)QBT_TR[CONTEXT=RSSWidget]</title>
    <link rel="stylesheet" href="css/style.css?v=${CACHEID}" type="text/css">
    <script defer src="scripts/localpreferences.js?v=${CACHEID}"></script>
    <script defer src="scripts/color-scheme.js?v=${CACHEID}"></script>
    <script>
        "use strict";

        window.addEventListener("DOMContentLoaded", (event) => {
            window.addEventListener("keydown", (event) => {
                switch (event.key) {
                    case "Enter":
                        event.preventDefault();
                        document.getElementById("submitButton").click();
                        break;
                    case "Escape":
                        event.preventDefault();
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                        break;
                }
            });

            document.getElementById("folderName").focus();
            document.getElementById("submitButton").addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();

                // check field
                const folderName = document.getElementById("folderName").value.trim();
                if (folderName === "") {
                    alert("QBT_TR(Name cannot be empty)QBT_TR[CONTEXT=HttpServer]");
                    return;
                }

                document.getElementById("submitButton").disabled = true;

                const path = new URLSearchParams(window.location.search).get("path");
                fetch("api/v2/rss/addFolder", {
                        method: "POST",
                        body: new URLSearchParams({
                            path: (((path !== null) && (path.length > 0)) ? `${path}\\${folderName}` : folderName)
                        })
                    })
                    .then(async (response) => {
                        if (!response.ok) {
                            if (response.status === 409)
                                alert(await response.text());
                            document.getElementById("submitButton").disabled = false;
                            return;
                        }

                        window.parent.qBittorrent.Rss.updateRssFeedList();
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                    });
            });
        });
    </script>
</head>

<body class="dialogPage">
    <div class="dialogPageContent">
        <label for="folderName">QBT_TR(Folder name:)QBT_TR[CONTEXT=RSSWidget]</label>
        <input type="text" id="folderName">
    </div>
    <div class="dialogButtons">
        <button type="button" id="submitButton">QBT_TR(OK)QBT_TR[CONTEXT=HttpServer]</button>
        <button type="button" onclick="parent.qBittorrent.Client.closeFrameWindow(window);">QBT_TR(Cancel)QBT_TR[CONTEXT=MainWindow]</button>
    </div>
</body>

</html>
