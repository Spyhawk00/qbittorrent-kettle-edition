<style type="text/css">
    #logTopBar {
        flex-shrink: 0;
    }

    #logFilterBar,
    #activityFilterBar {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-height: 28px; /* the same bar as on the Search and RSS tabs */
    }

    #logFilterBar select,
    #logFilterBar input,
    #logFilterBar button,
    #activityFilterBar select,
    #activityFilterBar input,
    #activityFilterBar button {
        box-sizing: border-box;
        height: 28px;
    }

    #logFilterBar.invisible,
    #activityFilterBar.invisible {
        display: none;
    }

    #logFilterBar>label,
    #activityFilterBar>label {
        font-weight: bold;
        margin-right: .3em;
    }

    #activityFilterBar>label:not(:first-child) {
        margin-left: .6em;
    }

    #logFilterBar>button,
    #activityFilterBar>button {
        display: inline-block;
        padding: 2px 12px;
    }

    #logView {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
        padding: 4px; /* as far from the edges as the boxes of the Transfers tab */
        overflow: auto;
    }

    /* a box like the lists of the Search and RSS tabs */
    #logContentView {
        background-color: var(--color-background-primary);
        border: 1px solid var(--color-border-outline);
        flex-grow: 1;
        min-height: 0;
        overflow: auto;
    }

    #logMessageTableFixedHeaderDiv .dynamicTableHeader,
    #logPeerTableFixedHeaderDiv .dynamicTableHeader,
    #logActivityTableFixedHeaderDiv .dynamicTableHeader {
        cursor: default;
    }

    #filterTextInput,
    #activityFilterInput {
        background-image: url("../images/edit-find.svg");
        background-repeat: no-repeat;
        background-position: 2px;
        background-size: 1.5em;
        padding: 2px 2px 2px 2em;
        width: 237px;
        border: 1px solid var(--color-border-outline);
    }

    #logFilterSummary {
        overflow: auto;
        margin: 8px 0;
    }

    #numFilteredLogs,
    #numTotalLogs {
        font-style: italic;
    }

    .logTableRowlogNormal {
        color: var(--color-text-default);
    }

    .logTableRowlogInfo {
        color: var(--color-text-blue);
    }

    .logTableRowlogWarning {
        color: var(--color-text-orange);
    }

    .logTableRowlogCritical,
    .logTableRowpeerBlocked,
    .logTableRowactivityDenied {
        color: var(--color-text-red);
    }

    .logTableRowactivityFailed {
        color: var(--color-text-orange);
    }

    .vsb-main>button {
        padding: 2px 12px !important;
    }

</style>

<div id="logView">
    <div id="logTopBar">
        <div id="logFilterBar">
            <label for="logLevelSelect">QBT_TR(Log Levels:)QBT_TR[CONTEXT=ExecutionLogWidget]</label>
            <select multiple size="1" id="logLevelSelect" class="logLevelSelect" onchange="window.qBittorrent.Log.logLevelChanged()">
                <option value="1">QBT_TR(Normal Messages)QBT_TR[CONTEXT=ExecutionLogWidget]</option>
                <option value="2">QBT_TR(Information Messages)QBT_TR[CONTEXT=ExecutionLogWidget]</option>
                <option value="4">QBT_TR(Warning Messages)QBT_TR[CONTEXT=ExecutionLogWidget]</option>
                <option value="8">QBT_TR(Critical Messages)QBT_TR[CONTEXT=ExecutionLogWidget]</option>
            </select>

            <input type="search" id="filterTextInput" oninput="window.qBittorrent.Log.filterTextChanged()" placeholder="QBT_TR(Filter logs)QBT_TR[CONTEXT=ExecutionLogWidget]" aria-label="QBT_TR(Filter logs)QBT_TR[CONTEXT=ExecutionLogWidget]" autocomplete="off" autocorrect="off" autocapitalize="none">
            <button type="button" title="Clear input" onclick="javascript:document.getElementById('filterTextInput').value='';window.qBittorrent.Log.filterTextChanged();">QBT_TR(Clear)QBT_TR[CONTEXT=ExecutionLogWidget]</button>
        </div>

        <div id="activityFilterBar" class="invisible">
            <label for="activityUserSelect">QBT_TR(User:)QBT_TR[CONTEXT=ExecutionLogWidget]</label>
            <select id="activityUserSelect" onchange="window.qBittorrent.Log.activityFilterChanged()">
                <option value="">QBT_TR(All)QBT_TR[CONTEXT=ExecutionLogWidget]</option>
            </select>
            <label for="activityCategorySelect">QBT_TR(Category:)QBT_TR[CONTEXT=ExecutionLogWidget]</label>
            <select id="activityCategorySelect" onchange="window.qBittorrent.Log.activityFilterChanged()">
                <option value="">QBT_TR(All)QBT_TR[CONTEXT=ExecutionLogWidget]</option>
            </select>
            <label for="activityOutcomeSelect">QBT_TR(Result:)QBT_TR[CONTEXT=ExecutionLogWidget]</label>
            <select id="activityOutcomeSelect" onchange="window.qBittorrent.Log.activityFilterChanged()">
                <option value="">QBT_TR(All)QBT_TR[CONTEXT=ExecutionLogWidget]</option>
            </select>

            <input type="search" id="activityFilterInput" oninput="window.qBittorrent.Log.activityFilterChanged()" placeholder="QBT_TR(Filter activity)QBT_TR[CONTEXT=ExecutionLogWidget]" aria-label="QBT_TR(Filter activity)QBT_TR[CONTEXT=ExecutionLogWidget]" autocomplete="off" autocorrect="off" autocapitalize="none">
            <button type="button" onclick="javascript:document.getElementById('activityFilterInput').value='';window.qBittorrent.Log.activityFilterChanged();">QBT_TR(Clear)QBT_TR[CONTEXT=ExecutionLogWidget]</button>
            <button type="button" onclick="window.qBittorrent.Log.exportActivity()">QBT_TR(Export...)QBT_TR[CONTEXT=ExecutionLogWidget]</button>
        </div>

        <div id="logFilterSummary">
            <span>QBT_TR(Results)QBT_TR[CONTEXT=ExecutionLogWidget] (QBT_TR(showing)QBT_TR[CONTEXT=ExecutionLogWidget] <span id="numFilteredLogs">0</span> QBT_TR(out of)QBT_TR[CONTEXT=ExecutionLogWidget] <span id="numTotalLogs">0</span>):</span>
        </div>
    </div>

    <div id="logContentView">
        <div id="logMessageView">
            <div id="logMessageTableDiv" class="dynamicTableDiv">
                <div id="logMessageTableFixedHeaderDiv" class="dynamicTableFixedHeaderDiv">
                    <table class="dynamicTable unselectable" style="position:relative;">
                        <thead>
                            <tr class="dynamicTableHeader"></tr>
                        </thead>
                    </table>
                </div>
                <table class="dynamicTable unselectable">
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div id="logPeerView" class="invisible">
            <div id="logPeerTableDiv" class="dynamicTableDiv">
                <div id="logPeerTableFixedHeaderDiv" class="dynamicTableFixedHeaderDiv">
                    <table class="dynamicTable unselectable" style="position:relative;">
                        <thead>
                            <tr class="dynamicTableHeader"></tr>
                        </thead>
                    </table>
                </div>
                <table class="dynamicTable unselectable">
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div id="logActivityView" class="invisible">
            <div id="logActivityTableFixedHeaderDiv" class="dynamicTableFixedHeaderDiv">
                <table class="dynamicTable unselectable" style="position:relative;">
                    <thead>
                        <tr class="dynamicTableHeader"></tr>
                    </thead>
                </table>
            </div>
            <div id="logActivityTableDiv" class="dynamicTableDiv">
                <table class="dynamicTable unselectable">
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<ul id="logTableMenu" class="contextMenu">
    <li><a href="#" id="copyLogDataToClipboard"><img src="images/edit-copy.svg" alt="QBT_TR(Copy)QBT_TR[CONTEXT=ExecutionLogWidget]">QBT_TR(Copy)QBT_TR[CONTEXT=ExecutionLogWidget]</a></li>
    <li><a href="#Clear"><img src="images/list-remove.svg" alt="QBT_TR(Clear)QBT_TR[CONTEXT=ExecutionLogWidget]">QBT_TR(Clear)QBT_TR[CONTEXT=ExecutionLogWidget]</a></li>
</ul>

<script>
    "use strict";

    window.qBittorrent ??= {};
    window.qBittorrent.Log ??= (() => {
        const exports = () => {
            return {
                init: init,
                unload: unload,
                load: load,
                setCurrentTab: setCurrentTab,
                getFilterText: getFilterText,
                getSelectedLevels: getSelectedLevels,
                logLevelChanged: logLevelChanged,
                filterTextChanged: filterTextChanged,
                activityFilterChanged: activityFilterChanged,
                activityCategoryName: activityCategoryName,
                activityOutcomeName: activityOutcomeName,
                exportActivity: exportActivity
            };
        };

        let currentSelectedTab = window.qBittorrent.Cache.account.can("qbt_log") ? "main" : "activity";
        const tableInfo = {
            main: {
                instance: new window.qBittorrent.DynamicTable.LogMessageTable(),
                progress: false,
                timer: null,
                last_id: -1
            },
            peer: {
                instance: new window.qBittorrent.DynamicTable.LogPeerTable(),
                progress: false,
                timer: null,
                last_id: -1
            },
            activity: {
                instance: new window.qBittorrent.DynamicTable.WebUIActivityTable(),
                progress: false,
                timer: null,
                last_id: -1
            }
        };

        // WebUI activity is filtered and limited by the server
        const ACTIVITY_LIMIT = 500;
        let activityTotal = 0;
        let activityCatalog = null;
        let activityFilterTimer = -1;

        let logFilterTimer = -1;
        let inputtedFilterText = "";
        let selectBox;
        let selectedLogLevels = window.qBittorrent.ClientData.get("qbt_selected_log_levels") ?? ["1", "2", "4", "8"];

        const init = () => {
            for (const option of document.getElementById("logLevelSelect").options)
                option.toggleAttribute("selected", selectedLogLevels.includes(option.value));

            selectBox = new vanillaSelectBox("#logLevelSelect", {
                maxHeight: 200,
                search: false,
                translations: {
                    all: "QBT_TR(All)QBT_TR[CONTEXT=ExecutionLogWidget]",
                    item: "QBT_TR(item)QBT_TR[CONTEXT=ExecutionLogWidget]",
                    items: "QBT_TR(items)QBT_TR[CONTEXT=ExecutionLogWidget]",
                    selectAll: "QBT_TR(Select All)QBT_TR[CONTEXT=ExecutionLogWidget]",
                    clearAll: "QBT_TR(Clear All)QBT_TR[CONTEXT=ExecutionLogWidget]",
                },
                placeHolder: "QBT_TR(Choose a log level...)QBT_TR[CONTEXT=ExecutionLogWidget]",
                keepInlineStyles: false
            });

            const logTableContextMenu = new window.qBittorrent.ContextMenu.ContextMenu({
                targets: ":is(#logMessageTableDiv, #logPeerTableDiv, #logActivityTableDiv) tbody tr",
                menu: "logTableMenu",
                actions: {
                    Clear: () => {
                        for (const rowId of tableInfo[currentSelectedTab].instance.selectedRowsIds())
                            tableInfo[currentSelectedTab].instance.removeRow(rowId);

                        updateLabelCount();
                    }
                },
                offsets: {
                    x: 3,
                    y: -90
                }
            });

            tableInfo["main"].instance.setup("logMessageTableDiv", "logMessageTableFixedHeaderDiv", logTableContextMenu);
            tableInfo["peer"].instance.setup("logPeerTableDiv", "logPeerTableFixedHeaderDiv", logTableContextMenu);
            tableInfo["activity"].instance.setup("logActivityTableDiv", "logActivityTableFixedHeaderDiv", logTableContextMenu);

            // without a saved sort, the newest activity comes first, as on the desktop
            const activityTable = tableInfo["activity"].instance;
            if (activityTable.getSortedColumn() === null) {
                activityTable.sortedColumn = "ts";
                activityTable.reverseSort = "1";
                activityTable.setSortedColumnIcon("ts", null, true);
            }

            MUI.Panels.instances.LogPanel.contentEl.style.height = "100%";

            showView(currentSelectedTab);
            load();
        };

        const showView = (tab) => {
            document.getElementById("logMessageView").classList.toggle("invisible", (tab !== "main"));
            document.getElementById("logPeerView").classList.toggle("invisible", (tab !== "peer"));
            document.getElementById("logActivityView").classList.toggle("invisible", (tab !== "activity"));
            document.getElementById("logFilterBar").classList.toggle("invisible", (tab === "activity"));
            document.getElementById("activityFilterBar").classList.toggle("invisible", (tab !== "activity"));
            if (tab === "main")
                selectBox.enable();
            else
                selectBox.disable();
        };

        const activityCategoryName = (category) => {
            return activityCatalog?.categories[category] ?? category;
        };

        const activityOutcomeName = (outcome) => {
            return activityCatalog?.outcomes[outcome] ?? outcome;
        };

        const loadActivityCatalog = async () => {
            if (activityCatalog !== null)
                return;

            const response = await fetch("api/v2/access/catalog", {
                method: "GET",
                cache: "no-store"
            });
            if (!response.ok)
                return;

            activityCatalog = await response.json();
            const fillSelect = (id, names) => {
                const select = document.getElementById(id);
                for (const [value, name] of Object.entries(names)) {
                    const option = document.createElement("option");
                    option.value = value;
                    option.textContent = name;
                    select.append(option);
                }
            };
            fillSelect("activityCategorySelect", activityCatalog.categories);
            fillSelect("activityOutcomeSelect", activityCatalog.outcomes);
        };

        const activityFilterParams = () => {
            return {
                user: document.getElementById("activityUserSelect").value,
                category: document.getElementById("activityCategorySelect").value,
                outcome: document.getElementById("activityOutcomeSelect").value,
                q: document.getElementById("activityFilterInput").value.trim()
            };
        };

        const activityFilterChanged = () => {
            clearTimeout(activityFilterTimer);
            activityFilterTimer = setTimeout(() => {
                activityFilterTimer = -1;
                tableInfo["activity"].last_id = -1;
                syncLogWithInterval(0);
            }, window.qBittorrent.Misc.FILTER_INPUT_DELAY);
        };

        const exportActivity = () => {
            const url = new URL("api/v2/access/exportActivity", window.location);
            url.search = new URLSearchParams(activityFilterParams());
            window.location.href = url.toString();
        };

        const updateActivityUsers = (users) => {
            const select = document.getElementById("activityUserSelect");
            const known = new Set([...select.options].map(option => option.value));
            for (const user of users) {
                if (known.has(user))
                    continue;
                const option = document.createElement("option");
                option.value = user;
                option.textContent = user;
                select.append(option);
            }
        };

        const unload = () => {
            for (const table in tableInfo) {
                if (!Object.hasOwn(tableInfo, table))
                    continue;
                resetTableTimer(table);
            }
        };

        const load = () => {
            syncLogWithInterval(100);
        };

        const resetTableTimer = (curTab) => {
            if (curTab === undefined)
                curTab = currentSelectedTab;

            clearTimeout(tableInfo[curTab].timer);
            tableInfo[curTab].timer = null;
        };

        const syncLogWithInterval = (interval) => {
            if (!tableInfo[currentSelectedTab].progress) {
                clearTimeout(tableInfo[currentSelectedTab].timer);
                tableInfo[currentSelectedTab].timer = syncLogData.delay(interval, null, currentSelectedTab);
            }
        };

        const getFilterText = () => {
            return inputtedFilterText;
        };

        const getSelectedLevels = () => {
            return selectedLogLevels;
        };

        const getSyncLogDataInterval = () => {
            return serverSyncMainDataInterval;
        };

        const logLevelChanged = () => {
            const value = selectBox.getResult().sort();

            if (selectedLogLevels !== value) {
                tableInfo[currentSelectedTab].last_id = -1;
                selectedLogLevels = value;
                // don't await this
                window.qBittorrent.ClientData.set({ qbt_selected_log_levels: selectedLogLevels }).catch(console.error);
                logFilterChanged();
            }
        };

        const filterTextChanged = () => {
            const value = document.getElementById("filterTextInput").value.trim();
            if (inputtedFilterText !== value) {
                inputtedFilterText = value;
                logFilterChanged();
            }
        };

        const logFilterChanged = () => {
            clearTimeout(logFilterTimer);
            logFilterTimer = setTimeout((curTab) => {
                logFilterTimer = -1;

                tableInfo[curTab].instance.updateTable(false);
                updateLabelCount(curTab);
            }, window.qBittorrent.Misc.FILTER_INPUT_DELAY, currentSelectedTab);
        };

        const setCurrentTab = (tab) => {
            if (tab === currentSelectedTab)
                return;

            currentSelectedTab = tab;
            showView(currentSelectedTab);
            for (const table of Object.keys(tableInfo)) {
                if (table !== currentSelectedTab)
                    resetTableTimer(table);
            }

            clearTimeout(logFilterTimer);
            logFilterTimer = -1;
            load();

            if (tableInfo[currentSelectedTab].instance.filterText !== getFilterText())
                tableInfo[currentSelectedTab].instance.updateTable();

            updateLabelCount();
        };

        const updateLabelCount = (curTab = undefined) => {
            if (curTab === undefined)
                curTab = currentSelectedTab;

            if (curTab === "activity") {
                document.getElementById("numFilteredLogs").textContent = tableInfo[curTab].instance.getRowSize();
                document.getElementById("numTotalLogs").textContent = activityTotal;
                return;
            }

            document.getElementById("numFilteredLogs").textContent = tableInfo[curTab].instance.filteredLength;
            document.getElementById("numTotalLogs").textContent = tableInfo[curTab].instance.getRowSize();
        };

        const syncActivityData = async () => {
            const curTab = "activity";
            tableInfo[curTab].progress = true;
            try {
                await loadActivityCatalog();

                const url = new URL("api/v2/access/activity", window.location);
                url.search = new URLSearchParams({ ...activityFilterParams(), limit: ACTIVITY_LIMIT });
                const response = await fetch(url, {
                    method: "GET",
                    cache: "no-store"
                });
                if (!response.ok)
                    throw new Error(await response.text());

                document.getElementById("error_div").textContent = "";
                if (document.getElementById("logTabColumn").classList.contains("invisible")) {
                    tableInfo[curTab].progress = false;
                    return;
                }

                const responseJSON = await response.json();
                updateActivityUsers(responseJSON.users);
                activityTotal = responseJSON.total;

                const newestId = (responseJSON.items.length > 0) ? responseJSON.items[0].id : 0;
                if (newestId !== tableInfo[curTab].last_id) {
                    const instance = tableInfo[curTab].instance;
                    const selected = instance.selectedRowsIds();
                    instance.clear();
                    for (const item of responseJSON.items)
                        instance.updateRowData({ ...item, rowId: item.id });
                    instance.reselectRows(selected.filter(id => instance.getRow(id) !== undefined));
                    instance.updateTable();
                    tableInfo[curTab].last_id = newestId;
                }
                updateLabelCount(curTab);

                tableInfo[curTab].progress = false;
                syncLogWithInterval(getSyncLogDataInterval());
            }
            catch (error) {
                console.error(error);
                tableInfo[curTab].progress = false;
                syncLogWithInterval(10000);
            }
        };

        const syncLogData = (curTab) => {
            if (document.hidden)
                return;

            if (curTab === undefined)
                curTab = currentSelectedTab;

            if (curTab === "activity") {
                syncActivityData();
                return;
            }

            let url;
            switch (curTab) {
                case "main":
                    url = new URL("api/v2/log/main", window.location);
                    url.search = new URLSearchParams({
                        normal: selectedLogLevels.includes("1"),
                        info: selectedLogLevels.includes("2"),
                        warning: selectedLogLevels.includes("4"),
                        critical: selectedLogLevels.includes("8")
                    });
                    break;

                case "peer":
                    url = new URL("api/v2/log/peers", window.location);
                    break;
            }

            url.searchParams.set("last_known_id", tableInfo[curTab].last_id);
            tableInfo[curTab].progress = true;

            fetch(url, {
                    method: "GET",
                    cache: "no-store"
                })
                .then(async (response) => {
                    if (!response.ok) {
                        const errorDiv = document.getElementById("error_div");
                        if (errorDiv)
                            errorDiv.textContent = "QBT_TR(qBittorrent client is not reachable)QBT_TR[CONTEXT=HttpServer]";
                        tableInfo[curTab].progress = false;
                        syncLogWithInterval(10000);
                        return;
                    }

                    document.getElementById("error_div").textContent = "";

                    if (document.getElementById("logTabColumn").classList.contains("invisible"))
                        return;

                    const responseJSON = await response.json();
                    if (responseJSON.length > 0) {
                        clearTimeout(logFilterTimer);
                        logFilterTimer = -1;

                        for (const logEntry of responseJSON) {
                            let row;
                            if (curTab === "main") {
                                row = {
                                    rowId: logEntry.id,
                                    message: logEntry.message,
                                    timestamp: logEntry.timestamp,
                                    type: logEntry.type,
                                };
                            }
                            else {
                                row = {
                                    rowId: logEntry.id,
                                    ip: logEntry.ip,
                                    timestamp: logEntry.timestamp,
                                    blocked: logEntry.blocked,
                                    reason: logEntry.reason,
                                };
                            }
                            tableInfo[curTab].instance.updateRowData(row);
                            tableInfo[curTab].last_id = Math.max(Number(logEntry.id), tableInfo[curTab].last_id);
                        }

                        tableInfo[curTab].instance.updateTable();
                        updateLabelCount(curTab);
                    }

                    tableInfo[curTab].progress = false;
                    syncLogWithInterval(getSyncLogDataInterval());
                }, (error) => {
                    console.error(error);

                    document.getElementById("error_div").textContent = "QBT_TR(qBittorrent client is not reachable)QBT_TR[CONTEXT=HttpServer]";
                    tableInfo[curTab].progress = false;
                    syncLogWithInterval(10000);
                });
        };

        document.getElementById("copyLogDataToClipboard").addEventListener("click", async (event) => {
            const instance = tableInfo[currentSelectedTab].instance;
            const type = { main: "message", peer: "ip", activity: "summary" }[currentSelectedTab];
            const msg = instance.selectedRowsIds().map((rowId) => instance.getRow(rowId).full_data[type]);
            await clipboardCopy(msg.join("\n"));
        });

        return exports();
    })();
    Object.freeze(window.qBittorrent.Log);
</script>
