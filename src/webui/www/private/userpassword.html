<!DOCTYPE html>
<html lang="${LANG}" class="dark">

<head>
    <meta charset="UTF-8">
    <title>QBT_TR(Change Password)QBT_TR[CONTEXT=UserAccounts]</title>
    <link rel="stylesheet" href="css/style.css?v=${CACHEID}" type="text/css">
    <script defer src="scripts/localpreferences.js?v=${CACHEID}"></script>
    <script defer src="scripts/color-scheme.js?v=${CACHEID}"></script>
    <script defer src="scripts/misc.js?locale=${LANG}&v=${CACHEID}"></script>
    <script>
        "use strict";

        window.addEventListener("DOMContentLoaded", (event) => {
            window.addEventListener("keydown", (event) => {
                switch (event.key) {
                    case "Enter":
                        if (event.target.tagName === "BUTTON")
                            break;
                        event.preventDefault();
                        document.getElementById("changePasswordButton").click();
                        break;
                    case "Escape":
                        event.preventDefault();
                        window.parent.qBittorrent.Client.closeFrameWindow(window);
                        break;
                }
            });

            const MIN_LENGTH = window.parent.qBittorrent.UserAccounts.getCatalog().password_min_length;
            const currentElem = document.getElementById("currentPassword");
            const newElem = document.getElementById("newPassword");
            const confirmElem = document.getElementById("newPasswordConfirm");
            newElem.placeholder = "QBT_TR(At least %1 characters)QBT_TR[CONTEXT=UserAccounts]".replace("%1", MIN_LENGTH);
            currentElem.focus();

            document.getElementById("changePasswordCancelButton").addEventListener("click", (e) => {
                window.parent.qBittorrent.Client.closeFrameWindow(window);
            });

            document.getElementById("changePasswordButton").addEventListener("click", async (e) => {
                e.preventDefault();
                e.stopPropagation();

                if (newElem.value.length < MIN_LENGTH) {
                    alert("QBT_TR(The password must be at least %1 characters long.)QBT_TR[CONTEXT=UserAccounts]".replace("%1", MIN_LENGTH));
                    return;
                }
                if (newElem.value !== confirmElem.value) {
                    alert("QBT_TR(The passwords don't match.)QBT_TR[CONTEXT=UserAccounts]");
                    return;
                }

                const response = await fetch("api/v2/access/changePassword", {
                    method: "POST",
                    body: new URLSearchParams({
                        current_password: currentElem.value,
                        new_password: newElem.value
                    })
                });
                if (!response.ok) {
                    alert(await response.text());
                    return;
                }

                alert("QBT_TR(Your password was changed. Other browsers and devices where you were logged in have been logged out.)QBT_TR[CONTEXT=UserAccounts]");
                window.parent.qBittorrent.Client.closeFrameWindow(window);
            });
        });
    </script>
</head>

<body class="dialogPage">
    <div class="dialogPageContent">
        <div class="dialogForm">
            <label for="currentPassword">QBT_TR(Current password:)QBT_TR[CONTEXT=UserAccounts]</label>
            <input type="password" id="currentPassword" autocomplete="current-password">
            <label for="newPassword">QBT_TR(New password:)QBT_TR[CONTEXT=UserAccounts]</label>
            <input type="password" id="newPassword" autocomplete="new-password">
            <label for="newPasswordConfirm">QBT_TR(Confirm password:)QBT_TR[CONTEXT=UserAccounts]</label>
            <input type="password" id="newPasswordConfirm" autocomplete="new-password">
        </div>
    </div>

    <div class="dialogButtons">
        <button type="button" id="changePasswordButton">QBT_TR(OK)QBT_TR[CONTEXT=UserAccounts]</button>
        <button type="button" id="changePasswordCancelButton">QBT_TR(Cancel)QBT_TR[CONTEXT=MainWindow]</button>
    </div>
</body>

</html>
